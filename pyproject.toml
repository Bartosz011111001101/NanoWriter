[project]
name = "nanowriter"
version = "0.1.0"
description = "Maly LLM budowany od zera"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.7",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanowriter"]

# PyTorch z CUDA 12.8 (wymagane dla RTX 50xx / Blackwell)
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
